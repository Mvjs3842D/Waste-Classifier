<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Waste Classifier - Upload Image</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <div class="container header-content">
            <h1><i class="fas fa-recycle"></i> Waste Classifier</h1>
            <button class="btn btn-danger" onclick="quitApplication()"><i class="fas fa-power-off"></i> Quit Application</button>
        </div>
    </header>

    <main class="container">
        <div class="main-grid">
            <!-- Upload Card -->
            <div class="card upload-card">
                <h3>Upload an Image to Classify</h3>
                <p>Select a JPG or PNG file from your computer.</p>
                <input type="file" id="imageUpload" accept="image/jpeg, image/png" onchange="previewImage()">
                <label for="imageUpload" class="btn btn-secondary"><i class="fas fa-upload"></i> Choose File...</label>
                <img id="imagePreview" src="#" alt="Image Preview" class="hidden">
                <button class="btn btn-primary hidden" id="testImageBtn" onclick="testUploadedImage(event)">
                    <i class="fas fa-cogs"></i> Classify This Image
                </button>
            </div>
            
            <!-- Result Card -->
            <div class="card result-card" id="resultCard">
                <div id="resultIcon">❓</div>
                <h2 id="resultTitle">No Image Tested</h2>
                <p id="resultType">Upload an image to see the result</p>
                <div class="confidence-bar">
                    <div id="confidenceFill" style="width: 0%;"></div>
                    <span id="confidenceValue">0%</span>
                </div>
                <div id="confidenceStatus" class="confidence-status">
                    <i class="fas fa-info-circle"></i><span>Awaiting image test</span>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast">
        <i class="fas fa-check-circle"></i>
        <span id="toastMessage">Success!</span>
    </div>

    <!-- Link to the simplified JavaScript file -->
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
